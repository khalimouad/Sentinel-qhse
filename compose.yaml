services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: sentinelle
      POSTGRES_USER: sentinelle_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - sentinelle-postgres:/var/lib/postgresql/data
      - ./database/local-init.sql:/docker-entrypoint-initdb.d/00-local-role.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sentinelle_owner -d sentinelle']
      interval: 5s
      timeout: 3s
      retries: 12
  minio:
    profiles: [storage]
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: [server, /data, --console-address, ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sentinelle-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sentinelle-minio-local-only}
      MINIO_API_CORS_ALLOW_ORIGIN: http://127.0.0.1:3000,http://localhost:3000
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - sentinelle-files:/data
volumes:
  sentinelle-postgres:
  sentinelle-files:
