services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: sentinelle
      POSTGRES_USER: sentinelle_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - sentinelle-postgres:/var/lib/postgresql/data
      - ./database/local-init.sql:/docker-entrypoint-initdb.d/00-local-role.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sentinelle_owner -d sentinelle']
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  sentinelle-postgres:
